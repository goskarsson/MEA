const ROUND_LABELS = { r1:"M1",r2:"M2",r3:"M3",r4:"M4",r5:"M5",r6:"M6",r12:"M12",r13:"M13",r14:"M14",r15:"M15",r16:"M16",r17:"M17" };
const KEILIR_ROUNDS = Object.keys(ROUND_LABELS);

function ptsClass(avg) {
  if (avg >= 2.8) return "great";
  if (avg >= 2.3) return "good";
  if (avg >= 1.7) return "ok";
  if (avg >= 1.2) return "poor";
  return "bad";
}

function rankClass(i) {
  if (i === 0) return "gold";
  if (i === 1) return "silver";
  if (i === 2) return "bronze";
  return "";
}

function rankIcon(i) {
  if (i === 0) return "🥇";
  if (i === 1) return "🥈";
  if (i === 2) return "🥉";
  return String(i + 1) + ".";
}

function buildCard(holeIdx) {
  const holePar  = PAR[holeIdx];
  const holeNum  = holeIdx + 1;

  // Compute per-player avg
  const stats = [];
  let totalRoundsAllPlayers = 0;
  for (const p of PLAYERS) {
    const pid = String(p.id);
    const rounds = HOLE_PTS[pid] || {};
    let sum = 0, count = 0;
    for (const rk of KEILIR_ROUNDS) {
      const arr = rounds[rk];
      if (arr && typeof arr[holeIdx] === "number") {
        sum += arr[holeIdx];
        count++;
      }
    }
    if (count > 0) {
      stats.push({ player: p, avg: sum / count, count });
      totalRoundsAllPlayers = Math.max(totalRoundsAllPlayers, count);
    }
  }
  stats.sort((a, b) => b.avg - a.avg || b.count - a.count);

  const parClass = holePar === 3 ? "p3" : holePar === 5 ? "p5" : "";

  let html = `<div class="hole-card">`;
  html += `<div class="hole-card-header">`;
  html += `<span class="hole-num">${holeNum}</span>`;
  html += `<span class="par-badge ${parClass}">Par ${holePar}</span>`;
  html += `<span class="hole-label">${stats.length} leikmenn</span>`;
  html += `</div>`;
  html += `<div class="player-list">`;

  for (let i = 0; i < stats.length; i++) {
    const s = stats[i];
    html += `<div class="player-row">`;
    html += `<span class="rank-num ${rankClass(i)}">${rankIcon(i)}</span>`;
    html += `<span class="player-name ${s.player.gender}">${s.player.short}</span>`;
    html += `<span class="avg-pts ${ptsClass(s.avg)}">${s.avg.toFixed(1)}</span>`;
    html += `<span class="rnd-count">${s.count}r</span>`;
    html += `</div>`;
  }

  html += `</div></div>`;
  return html;
}

// Build all 18 holes
let frontHtml = "", backHtml = "";
for (let i = 0; i < 9;  i++) frontHtml += buildCard(i);
for (let i = 9; i < 18; i++) backHtml  += buildCard(i);

document.getElementById("front-nine").innerHTML = frontHtml;
document.getElementById("back-nine").innerHTML  = backHtml;

// Info bar
const roundList = Object.values(ROUND_LABELS).join(", ");
const playerCount = Object.keys(HOLE_PTS).length;
document.getElementById("info-text").textContent =
  `${playerCount} leikmenn · Keilir-hringir: ${roundList} · Stig = Stableford-stig á holu (2 = par, 3 = birdie, 1 = bogey)`;
